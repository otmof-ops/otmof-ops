<svg xmlns="http://www.w3.org/2000/svg" width="820" height="412" viewBox="0 0 820 412" role="img" aria-label="hello, from start to exit, median milliseconds: Lua 5.4 0.9, Rust 0.9, LuaJIT 2.1 1.0, cig, compiled (stage b) 3.7, cig run 5.8, CPython 3.13 13.5, Node 22 27.2. From cig-script docs/BENCHMARKS-2026-11-15.md.">
<title>hello, start to exit</title>
<defs>
  <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <style>
    .h { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f97316; }
    .big { font: 700 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f97316; }
    .l { font: 400 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #c9d1d9; }
    .lh { font: 700 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f97316; }
    .k { font: 400 12px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #8b949e; }
    .v { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .vh { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f97316; }
    .box { fill: none; stroke: #3d444d; stroke-width: 1.5; }
    .hot { fill: none; stroke: #f97316; stroke-width: 2; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .rise { animation: rise 0.6s ease-out backwards; }
    .val { animation: fade 0.4s ease-out backwards; }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar, .rise, .val { animation: none; } }
  </style>
</defs>
<text x="20" y="30" class="h">hello, start to exit</text>
<text x="20" y="54" class="k">median of 62 timed runs each, in milliseconds, start-up included; shorter is faster</text>
<text x="226" y="96" class="l" text-anchor="end">Lua 5.4</text><rect class="bar" style="animation-delay: 200ms" x="240" y="82" width="15.6" height="19" rx="4" fill="#6e7681"/><text class="val v" style="animation-delay: 700ms" x="265.6" y="96">0.9 ms</text>
<text x="226" y="130" class="l" text-anchor="end">Rust</text><rect class="bar" style="animation-delay: 320ms" x="240" y="116" width="15.6" height="19" rx="4" fill="#6e7681"/><text class="val v" style="animation-delay: 820ms" x="265.6" y="130">0.9 ms</text>
<text x="226" y="164" class="l" text-anchor="end">LuaJIT 2.1</text><rect class="bar" style="animation-delay: 440ms" x="240" y="150" width="17.3" height="19" rx="4" fill="#6e7681"/><text class="val v" style="animation-delay: 940ms" x="267.3" y="164">1.0 ms</text>
<text x="226" y="198" class="lh" text-anchor="end">cig, compiled (stage b)</text><rect class="bar" style="animation-delay: 560ms" x="240" y="184" width="63.9" height="19" rx="4" fill="url(#ember)"/><text class="val vh" style="animation-delay: 1060ms" x="313.9" y="198">3.7 ms</text>
<text x="226" y="232" class="lh" text-anchor="end">cig run</text><rect class="bar" style="animation-delay: 680ms" x="240" y="218" width="100.2" height="19" rx="4" fill="url(#ember)"/><text class="val vh" style="animation-delay: 1180ms" x="350.2" y="232">5.8 ms</text>
<text x="226" y="266" class="l" text-anchor="end">CPython 3.13</text><rect class="bar" style="animation-delay: 800ms" x="240" y="252" width="233.3" height="19" rx="4" fill="#6e7681"/><text class="val v" style="animation-delay: 1300ms" x="483.3" y="266">13.5 ms</text>
<text x="226" y="300" class="l" text-anchor="end">Node 22</text><rect class="bar" style="animation-delay: 920ms" x="240" y="286" width="470.0" height="19" rx="4" fill="#6e7681"/><text class="val v" style="animation-delay: 1420ms" x="720.0" y="300">27.2 ms</text>
<text x="20" y="338" class="k">cig 1.24.0 and cigcompile 0.5.0 as released; one 2018 laptop on battery, 15 Nov 2026.</text>
<text x="20" y="358" class="k">Lua 5.4.9, LuaJIT 2.1, CPython 3.13.5, Node 22.23.5, Rust 1.100.0.</text>
<text x="20" y="378" class="k">cig's start-up grows with its run history (cig-script#252).</text>
<text x="20" y="398" class="k">Every number: cig-script docs/BENCHMARKS-2026-11-15.md.</text>
</svg>
