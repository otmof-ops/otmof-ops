name: cards

# Draws the profile's images: the cards and the contribution snake from
# GitHub's own numbers, and the benchmark images from the paper's numbers
# (scripts/numbers.py). Runs once a day and on every change to main, and
# publishes the images to the `output` branch, which holds nothing else and is
# rewritten each time. A pull request draws them too, as its check, and
# publishes nothing.
#
# Drawing runs with a read-only token; only the publish job can write, and it
# runs only on main, after the images have been drawn and checked.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: true

env:
  PINS: vidpull briefkit nudge mosaic-wallpaper hw-temp-monitor

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          args=()
          for pin in $PINS; do args+=(--pin "$pin"); done
          python3 scripts/cards.py --user "$OWNER" --out dist "${args[@]}"

      - name: Draw the benchmark images
        run: python3 scripts/numbers.py dist

      - name: Draw the snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#f97316&color_dots=#161b22,#431407,#7c2d12,#c2410c,#f97316
            dist/snake-light.svg?palette=github-light&color_snake=#c2410c&color_dots=#ebedf0,#fed7aa,#fdba74,#fb923c,#ea580c

      - name: Check every image
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.dom.minidom
          names = ["stats", "languages", "releases", "headline", "start-up", "snake"]
          names += [f"pin-{pin}" for pin in os.environ["PINS"].split()]
          expected = {f"{name}{theme}.svg" for name in names for theme in ("", "-light")}
          found = {os.path.basename(path) for path in glob.glob("dist/*")}
          if found != expected:
              sys.exit(f"missing {sorted(expected - found)}, unexpected {sorted(found - expected)}")
          for name in sorted(found):
              xml.dom.minidom.parse(os.path.join("dist", name))
          print(f"{len(found)} images, all well-formed")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: draw
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images

      - name: Publish to the output branch
        run: |
          git switch --orphan output
          git clean -ffdxq
          cp "$RUNNER_TEMP"/images/*.svg .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Images, $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f origin refs/heads/output:refs/heads/output
